<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VITA Detection — Service Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0a1f5c;--navy2:#1a3a7a;--blue:#1a56db;--blue-light:#eff6ff;--blue-mid:#dbeafe;
  --green:#0a7c4e;--green-light:#ecfdf5;--red:#b91c1c;--red-light:#fef2f2;
  --amber:#b45309;--amber-light:#fffbeb;
  --gray:#64748b;--gray2:#94a3b8;--gray-light:#f8fafc;--gray-border:#e2e8f0;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.1);--shadow-lg:0 10px 40px rgba(0,0,0,.18);
  --radius:8px;--radius-lg:12px;--radius-xl:16px;--font:'DM Sans',sans-serif;
}
body{font-family:var(--font);background:#f1f5f9;color:#1e293b;min-height:100vh;}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
.loading-screen svg{margin-bottom:24px;}
.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px;}
.loading-msg{color:rgba(255,255,255,.7);font-size:14px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* AUTH */
.auth-wrap{min-height:100vh;background:linear-gradient(160deg,var(--navy) 0%,#1e3a8a 50%,#0f2459 100%);display:flex;align-items:center;justify-content:center;}
.auth-card{background:#fff;border-radius:var(--radius-xl);padding:44px 40px;width:420px;box-shadow:var(--shadow-lg);}
.auth-logo{text-align:center;margin-bottom:28px;}
.auth-logo p{font-size:11px;color:var(--gray2);letter-spacing:1.5px;text-transform:uppercase;margin-top:6px;}
.auth-title{font-size:22px;font-weight:700;color:var(--navy);text-align:center;margin-bottom:4px;}
.auth-sub{font-size:13px;color:var(--gray);text-align:center;margin-bottom:24px;}
.auth-input{display:block;width:100%;padding:11px 14px;font-size:14px;border-radius:var(--radius);border:1.5px solid var(--gray-border);margin-bottom:12px;font-family:var(--font);color:#1e293b;}
.auth-input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(26,86,219,.1);}
.auth-btn{width:100%;padding:12px;background:var(--navy);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);transition:background .2s;}
.auth-btn:hover{background:var(--navy2);}
.auth-err{background:var(--red-light);color:var(--red);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:12px;border:1px solid #fca5a5;}
.auth-ok{background:var(--green-light);color:var(--green);border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:12px;border:1px solid #6ee7b7;}

/* LAYOUT */
.app{display:flex;min-height:100vh;}
.sidebar{width:230px;min-width:230px;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;}
.sidebar-logo{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo-sub{display:block;font-size:9px;color:rgba(255,255,255,.3);margin-top:5px;letter-spacing:1.8px;text-transform:uppercase;}
.nav-label{padding:14px 18px 5px;font-size:9.5px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:7px;margin:1px 8px;cursor:pointer;color:rgba(255,255,255,.65);font-size:13px;transition:all .15s;user-select:none;}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600;}
.nav-badge{margin-left:auto;background:rgba(239,68,68,.9);color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700;}
.sidebar-footer{margin-top:auto;padding:14px 8px;border-top:1px solid rgba(255,255,255,.08);}
.user-pill{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius);cursor:pointer;color:rgba(255,255,255,.8);font-size:12px;}
.user-pill:hover{background:rgba(255,255,255,.08);}
.avatar{border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;}
.main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:#fff;padding:0 28px;height:58px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--gray-border);position:sticky;top:0;z-index:50;}
.topbar-title{font-size:16px;font-weight:700;color:var(--navy);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.notif-wrap{position:relative;}
.notif-btn{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--gray-border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.notif-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:#ef4444;border-radius:50%;border:2px solid #fff;}
.sync-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gray);padding:4px 10px;border-radius:20px;border:1px solid var(--gray-border);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.sync-dot.syncing{background:var(--amber);animation:pulse .8s infinite;}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.content{padding:24px 28px;flex:1;}

/* COMPONENTS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:var(--font);transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--navy);color:#fff;}.btn-primary:hover{background:var(--navy2);}
.btn-secondary{background:#fff;color:var(--navy);border:1px solid var(--gray-border);}.btn-secondary:hover{background:var(--gray-light);}
.btn-danger{background:var(--red);color:#fff;}.btn-success{background:var(--green);color:#fff;}
.btn-sm{padding:5px 12px;font-size:12px;}.btn-xs{padding:3px 8px;font-size:11px;}
.card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:20px;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.card-title{font-size:14px;font-weight:700;color:var(--navy);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;}
.modal{background:#fff;border-radius:var(--radius-xl);width:100%;max-width:660px;box-shadow:var(--shadow-lg);}
.modal-lg{max-width:860px;}
.modal-header{padding:18px 24px;border-bottom:1px solid var(--gray-border);display:flex;justify-content:space-between;align-items:center;border-radius:var(--radius-xl) var(--radius-xl) 0 0;background:#fff;}
.modal-header h3{font-size:16px;font-weight:700;color:var(--navy);}
.modal-close{width:30px;height:30px;border-radius:var(--radius);border:1px solid var(--gray-border);background:#fff;cursor:pointer;font-size:16px;color:var(--gray);display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:var(--gray-light);}
.modal-body{padding:24px;}
.modal-footer{padding:14px 24px;border-top:1px solid var(--gray-border);display:flex;gap:8px;justify-content:flex-end;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.fg label{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;}
.fg input,.fg select,.fg textarea{padding:9px 12px;border:1.5px solid var(--gray-border);border-radius:var(--radius);font-size:13px;font-family:var(--font);color:#1e293b;background:#fff;transition:border .15s;width:100%;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(26,86,219,.08);}
.fg textarea{resize:vertical;min-height:72px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px;}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.b-open{background:#dbeafe;color:#1e40af;}.b-progress{background:#fef3c7;color:#92400e;}
.b-resolved{background:#d1fae5;color:#065f46;}.b-closed{background:#e0e7ff;color:#3730a3;}
.b-pending{background:#fee2e2;color:#991b1b;}
.b-admin{background:#fde8e8;color:#9b1c1c;}.b-tech{background:#d1fae5;color:#065f46;}
.b-accounting{background:#fff3e0;color:#92400e;}.b-manager{background:#e0e7ff;color:#4c1d95;}
.b-viewer{background:#f1f5f9;color:#475569;}
.b-crit{background:#fee2e2;color:#991b1b;}.b-noncrit{background:#fef9c3;color:#713f12;}
.b-green{background:#d1fae5;color:#065f46;}.b-amber{background:#fef3c7;color:#92400e;}
table{width:100%;border-collapse:collapse;font-size:13px;}
table th{text-align:left;padding:10px 14px;background:#f8fafc;font-size:10.5px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;border-bottom:1.5px solid var(--gray-border);}
table td{padding:10px 14px;border-bottom:1px solid #f0f4f8;color:#374151;vertical-align:middle;}
table tr:hover td{background:#fafbfc;}
.tbl-actions{display:flex;gap:5px;}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.sh-title{font-size:15px;font-weight:700;color:var(--navy);}
.stat-card{background:#fff;border-radius:var(--radius-lg);padding:18px 22px;box-shadow:var(--shadow);}
.stat-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;float:right;}
.stat-lbl{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;}
.stat-val{font-size:30px;font-weight:700;color:var(--navy);margin:4px 0 2px;}
.stat-sub{font-size:12px;color:var(--gray2);}
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filter-bar input,.filter-bar select{padding:7px 11px;border:1.5px solid var(--gray-border);border-radius:var(--radius);font-size:13px;font-family:var(--font);}
.tab-bar{display:flex;border-bottom:2px solid var(--gray-border);margin-bottom:20px;}
.tab{padding:9px 18px;font-size:13px;font-weight:500;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
.tab.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:700;}
.tl-item{display:flex;gap:12px;padding:8px 0;position:relative;}
.tl-item:not(:last-child)::after{content:'';position:absolute;left:5px;top:20px;bottom:-4px;width:1.5px;background:var(--gray-border);}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:3px;border:2px solid #fff;box-shadow:0 0 0 2px var(--blue);}
.tl-text{font-size:13px;color:#374151;}.tl-time{font-size:11px;color:var(--gray2);margin-top:2px;}
.cmt-box{background:#f8fafc;border-radius:var(--radius);padding:14px;margin-bottom:10px;border-left:3px solid var(--blue-mid);}
.cmt-user{font-weight:700;font-size:12px;color:var(--navy);}
.cmt-time{font-size:11px;color:var(--gray2);}
.cmt-text{font-size:13px;color:#374151;line-height:1.5;margin-top:4px;}
.tdg{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;}
.tdf label{font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;display:block;}
.tdf p{font-size:13px;color:#1e293b;margin-top:3px;}
.np{position:absolute;right:0;top:48px;width:340px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);border:1px solid var(--gray-border);z-index:300;overflow:hidden;}
.np-hdr{padding:12px 16px;border-bottom:1px solid var(--gray-border);font-size:13px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:center;}
.np-item{padding:12px 16px;border-bottom:1px solid #f0f4f8;cursor:pointer;}
.np-item:hover{background:var(--gray-light);}
.np-item.unread{background:var(--blue-light);}
.ptoggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f4f8;}
.toggle{width:38px;height:22px;background:var(--gray-border);border-radius:11px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--green);}
.toggle-k{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on .toggle-k{transform:translateX(16px);}
.es{text-align:center;padding:48px 24px;color:var(--gray);}
.es-icon{font-size:40px;margin-bottom:12px;opacity:.4;}
.wok{color:var(--green);font-weight:600;}.wam{color:var(--amber);font-weight:600;}.wex{color:var(--red);font-weight:600;}
.info-banner{padding:10px 14px;border-radius:var(--radius);font-size:12px;margin-bottom:14px;border:1px solid;}
.info-amber{background:var(--amber-light);color:var(--amber);border-color:#fcd34d;}
.info-red{background:var(--red-light);color:var(--red);border-color:#fca5a5;}
.info-green{background:var(--green-light);color:var(--green);border-color:#6ee7b7;}
</style>
</head>

<div id="root"></div>
<script>
// -- CONFIG --------------------------------------------------------------------
const BIN_ID = '69fcb79eadc21f119a695a77';
const API_KEY = '$2a$10$zAa/3QkSe.c6YGM9owPbl.x48Ow7Hop697MzmTbtNt69ztlJtXu9K';
const BASE_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;
const LS_KEY = 'vita_portal_db';

// -- STORAGE: JSONBin primary, localStorage fallback ---------------------------
const Api = {
  async read() {
    try {
      const r = await fetch(BASE_URL + '/latest', {
        headers: { 'X-Master-Key': API_KEY }
      });
      if (r.ok) {
        const j = await r.json();
        if (j.record) {
          // Mirror to localStorage
          localStorage.setItem(LS_KEY, JSON.stringify(j.record));
          return j.record;
        }
      }
    } catch(e) {}
    // Fallback to localStorage
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
    return null;
  },
  async write(data) {
    // Always save to localStorage immediately
    localStorage.setItem(LS_KEY, JSON.stringify(data));
    // Then try to sync to JSONBin in background
    try {
      await fetch(BASE_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
        body: JSON.stringify(data)
      });
    } catch(e) {}
    return true;
  },
  isCloud() {
    try {
      return !!localStorage.getItem(LS_KEY + '_cloud_ok');
    } catch(e) { return false; }
  }
};

// -- DEFAULT DATA STRUCTURE -----------------------------------------------------
const EMPTY_DB = {
  users: [
    {id:1,name:'Admin User',email:'admin@vita.com',password:'Admin@123',role:'Admin',active:true,
     permissions:{tickets:true,machines:true,customers:true,users:true,reports:true,tools:true}},
  ],
  customers: [], machines: [], tickets: [], tools: [], notifications: [],
  lists: {
    ticketTypes:['Corrective Maintenance / Service','Preventive Maintenance','Installation','Radiation Survey','Relocation','Training'],
    ticketStatuses:['Open','In Progress','Resolved - Pending Parts','Resolved - Pending Payment','Resolved - Pending Visit','Resolved - Parts Sent','Resolved - Pending PO','Resolved - Pending S/W','Resolved - Pending Remote Session','Resolved','Closed'],
    resolutionTypes:['Remote - TeamViewer','Phone','Email','Text/SMS','Dispatch Tech','Parts Sent'],
    severities:['Critical','Non-Critical'],
    machineStatuses:['Operational','Non-Operational','Partially Operational'],
    categories:['Software','Hardware','Network','Mechanical','Electrical','Other'],
    subCategories:['Biosans Software','Operating System','X-Ray Generator','Conveyor','Photo Sensors','Display','Power Supply','Other'],
    reportedBy:['Customer','VITA Team','Internal'],
    countries:['Lebanon','UAE','Saudi Arabia','Turkey','United States','Canada','United Kingdom','Australia','Germany','France','Other'],
    models:['XR3D-4','XR3D-6D','XR3D-60','XR3D-100BD','XR3D-55i'],
    paymentTerms:['Prepaid','Postpaid','Net 30 Days','Net 60 Days','Net 90 Days'],
    roles:['Admin','Tech','Accounting','Manager','Viewer'],
  }
};
const PERMS = ['tickets','machines','customers','users','reports','tools'];

// -- HELPERS -------------------------------------------------------------------
const now = () => new Date().toISOString().slice(0,16).replace('T',' ');
const today = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { if(!d)return'—'; try{return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch{return d;} };
const nextId = arr => arr && arr.length ? Math.max(...arr.map(x=>x.id||0))+1 : 1;
const initials = n => (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const sc = s => s==='Open'?'b-open':s==='In Progress'?'b-progress':s==='Closed'?'b-closed':'b-resolved';
const rc = r => r==='Admin'?'b-admin':r==='Tech'?'b-tech':r==='Accounting'?'b-accounting':r==='Manager'?'b-manager':'b-viewer';

// -- REACT SETUP ---------------------------------------------------------------
const {createElement:h, useState, useEffect, useRef, useCallback} = React;

// -- SVG ICON ------------------------------------------------------------------
const ICONS = {
  home:'M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z M9 22V12h6v10',

  refresh:'M23 4v6h-6 M1 20v-6h6 M3.51 9a9 9 0 0114.85-3.36L23 10 M1 14l4.64 4.36A9 9 0 0020.49 15',

function Icon({name,size=18,style={}}) {
  const d = ICONS[name]||'';
  return h('svg',{viewBox:'0 0 24 24',width:size,height:size,fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round',style:{flexShrink:0,...style}},
    d.split(' M').map((seg,i)=>h('path',{key:i,d:(i===0?'':' M')+seg}))
  );
}

// -- SMART SELECT --------------------------------------------------------------
function SmartSelect({listKey, value, onChange, db, onDbChange, placeholder='— Select —', allowEmpty=true}) {
  const [adding, setAdding] = useState(false);
  const [nv, setNv] = useState('');
  const opts = (db.lists||{})[listKey] || [];

  const doAdd = () => {
    if (!nv.trim()) return;
    const updated = {...db, lists:{...db.lists, [listKey]:[...opts, nv.trim()]}};
    onDbChange(updated, true);
    onChange(nv.trim());
    setNv(''); setAdding(false);
  };

  return h('div',null,
    h('select',{value:value||'',onChange:e=>{
      if(e.target.value==='__add__'){setAdding(true);}
      else{onChange(e.target.value);}
    }},
      allowEmpty && h('option',{value:''},placeholder),
      opts.map(o=>h('option',{key:o,value:o},o)),
      h('option',{value:'__add__'},'+ Add new option...')
    ),
    adding && h('div',{style:{display:'flex',gap:6,marginTop:6}},
      h('input',{type:'text',value:nv,onChange:e=>setNv(e.target.value),placeholder:'New option...',autoFocus:true,
        onKeyDown:e=>{if(e.key==='Enter')doAdd();if(e.key==='Escape'){setAdding(false);setNv('');}},
        style:{flex:1,padding:'7px 10px',border:'1.5px solid var(--gray-border)',borderRadius:'var(--radius)',fontFamily:'var(--font)',fontSize:13}}),
      h('button',{type:'button',className:'btn btn-primary btn-sm',onClick:doAdd},'Add'),
      h('button',{type:'button',className:'btn btn-secondary btn-sm',onClick:()=>{setAdding(false);setNv('');}}, 'Cancel')
    )
  );
}

// -- FG SHORTCUT ---------------------------------------------------------------
const FG = ({label,children}) => h('div',{className:'fg'},h('label',null,label),children);

// -- NOTIFICATIONS -------------------------------------------------------------
function NotifPanel({db, userId, onClose, onDbChange}) {
  const all = db.notifications||[];
  const mine = userId===1 ? all : all.filter(n=>n.userId===userId);
  const markAll = () => {
    const updated = {...db, notifications: all.map(n=>({...n,read:true}))};
    onDbChange(updated, true);
    onClose();
  };
  return h('div',{className:'np'},
    h('div',{className:'np-hdr'},
      h('span',null,'Notifications ('+mine.filter(n=>!n.read).length+' new)'),
      h('button',{className:'btn btn-xs btn-secondary',onClick:markAll},'Mark all read')
    ),
    mine.length===0
      ? h('div',{style:{padding:'20px',textAlign:'center',color:'var(--gray)',fontSize:13}},'No notifications')
      : mine.slice(0,12).map(n=>h('div',{key:n.id,className:'np-item'+(n.read?'':' unread')},
          h('div',{style:{fontWeight:600,fontSize:13}},n.title),
          h('div',{style:{fontSize:12,color:'var(--gray)',marginTop:2}},n.body),
          h('div',{style:{fontSize:11,color:'var(--gray2)',marginTop:3}},n.date)
        ))
  );
}

// -- TICKET FORM ---------------------------------------------------------------
function TicketForm({ticket, db, onSave, onClose, user, onDbChange}) {
  const {machines=[],customers=[],users=[]} = db;
  const blank = {
    contactDate:today(),serialNumber:'',machineId:'',status:'Open',ticketType:'',
    reportedBy:'',assignedTo:'',dispatchTech:'',etaDate:'',severity:'',machineStatus:'',
    resolutionBy:'',category:'',subCategory:'',reportedProblem:'',actualProblem:'',
    actionTaken:'',customerPO:'',quotationNumber:'',quotationAmount:'',
    customerName:'',customerEmail:'',customerPhone:'',
    comments:[],timeline:[],createdBy:user.id,createdAt:today()
  };
  const [form, setForm] = useState(ticket?{...ticket}:blank);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  const pickMachine = id => {
    const m = machines.find(x=>x.id===parseInt(id));
    if (m) {
      const c = customers.find(x=>x.id===m.customerId);
      setForm(f=>({...f,machineId:id,serialNumber:m.serialNumber,
        customerName:c?c.name:'',customerEmail:c?c.email:'',customerPhone:c?c.phone:''}));
    } else { set('machineId',id); }
  };

  const save = () => {
    if (!form.serialNumber||!form.ticketType||!form.status) {
      alert('Please fill: Serial Number, Ticket Type, Status'); return;
    }
    const all = db.tickets||[];
    const tl = [...(form.timeline||[]),{action:ticket?'Updated':'Created',user:user.name,date:now()}];
    let updated;
    if (ticket) {
      updated = {...db, tickets: all.map(t=>t.id===ticket.id?{...form,timeline:tl}:t)};
    } else {
      const newId=nextId(all);
      const nt = {...form,id:newId,ticketNumber:'TKN-'+(1000+newId),timeline:tl,comments:[]};
      let notifs = db.notifications||[];
      if (form.assignedTo) {
        notifs = [...notifs,{id:nextId(notifs),userId:parseInt(form.assignedTo),
          title:nt.ticketNumber+' assigned to you',body:'Assigned by '+user.name,date:now(),read:false}];
      }
      updated = {...db, tickets:[...all,nt], notifications:notifs};
    }
    onDbChange(updated, true);
    onSave();
  };

  const S = ({lk,val,setter}) => h(SmartSelect,{listKey:lk,value:val,onChange:setter,db,onDbChange});
  const techUsers = (users||[]).filter(u=>u.role==='Tech'||u.role==='Admin');

  return h('div',{className:'modal-bg'},
    h('div',{className:'modal modal-lg'},
      h('div',{className:'modal-header'},
        h('h3',null,ticket?'Edit '+ticket.ticketNumber:'New Ticket'),
        h('button',{className:'modal-close',onClick:onClose},'✕')
      ),
      h('div',{className:'modal-body'},
        h('div',{className:'grid-3'},
          h(FG,{label:'Contact Date *'},h('input',{type:'date',value:form.contactDate||'',onChange:e=>set('contactDate',e.target.value)})),
          h(FG,{label:'Machine'},
            h('select',{value:form.machineId||'',onChange:e=>pickMachine(e.target.value)},
              h('option',{value:''},'— Select Machine —'),
              machines.map(m=>h('option',{key:m.id,value:m.id},m.serialNumber+' — '+m.model+' ('+m.location+')'))
            )
          ),
          h(FG,{label:'Serial Number *'},h('input',{type:'text',value:form.serialNumber||'',onChange:e=>set('serialNumber',e.target.value)}))
        ),
        h('div',{className:'grid-3'},
          h(FG,{label:'Status *'},h(S,{lk:'ticketStatuses',val:form.status,setter:v=>set('status',v)})),
          h(FG,{label:'Ticket Type *'},h(S,{lk:'ticketTypes',val:form.ticketType,setter:v=>set('ticketType',v)})),
          h(FG,{label:'Reported By'},h(S,{lk:'reportedBy',val:form.reportedBy,setter:v=>set('reportedBy',v)}))
        ),
        h('div',{className:'grid-3'},
          h(FG,{label:'Assigned To'},
            h('select',{value:form.assignedTo||'',onChange:e=>set('assignedTo',e.target.value)},
              h('option',{value:''},'— Select —'),
              (users||[]).map(u=>h('option',{key:u.id,value:u.id},u.name))
            )
          ),
          h(FG,{label:'Severity'},h(S,{lk:'severities',val:form.severity,setter:v=>set('severity',v)})),
          h(FG,{label:'Machine Status'},h(S,{lk:'machineStatuses',val:form.machineStatus,setter:v=>set('machineStatus',v)}))
        ),
        h('div',{className:'grid-3'},
          h(FG,{label:'Resolution By'},h(S,{lk:'resolutionTypes',val:form.resolutionBy,setter:v=>set('resolutionBy',v)})),
          h(FG,{label:'Dispatch Tech'},
            h('select',{value:form.dispatchTech||'',onChange:e=>set('dispatchTech',e.target.value)},
              h('option',{value:''},'— None —'),
              techUsers.map(u=>h('option',{key:u.id,value:u.id},u.name))
            )
          ),
          h(FG,{label:'ETA Date'},h('input',{type:'date',value:form.etaDate||'',onChange:e=>set('etaDate',e.target.value)}))
        ),
        h('div',{className:'grid-3'},
          h(FG,{label:'Category'},h(S,{lk:'categories',val:form.category,setter:v=>set('category',v)})),
          h(FG,{label:'Sub Category'},h(S,{lk:'subCategories',val:form.subCategory,setter:v=>set('subCategory',v)})),
          h(FG,{label:'Customer PO'},h('input',{type:'text',value:form.customerPO||'',onChange:e=>set('customerPO',e.target.value)}))
        ),
        h('div',{className:'grid-3'},
          h(FG,{label:'Customer Name'},h('input',{type:'text',value:form.customerName||'',onChange:e=>set('customerName',e.target.value)})),
          h(FG,{label:'Customer Email'},h('input',{type:'email',value:form.customerEmail||'',onChange:e=>set('customerEmail',e.target.value)})),

          h(FG,{label:'Quotation #'},h('input',{type:'text',value:form.quotationNumber||'',onChange:e=>set('quotationNumber',e.target.value)})),
          h(FG,{label:'Quotation Amount'},h('input',{type:'text',value:form.quotationAmount||'',onChange:e=>set('quotationAmount',e.target.value)})),

        h('div',{className:'grid-2'},
          h(FG,{label:'Actual Problem'},h('textarea',{value:form.actualProblem||'',onChange:e=>set('actualProblem',e.target.value),rows:2})),
          h(FG,{label:'Action Taken'},h('textarea',{value:form.actionTaken||'',onChange:e=>set('actionTaken',e.target.value),rows:2}))
        )
      ),
      h('div',{className:'modal-footer'},
        h('button',{className:'btn btn-secondary',onClick:onClose},'Cancel'),
        h('button',{className:'btn btn-primary',onClick:save},ticket?'Save Changes':'Create Ticket')
      )
    )
  );
}

function TicketDetail({ticketId, db, onClose, onEdit, user, onDbChange}) {
  const [tab, setTab] = useState('details');
  const [comment, setComment] = useState('');
  const t = (db.tickets||[]).find(x=>x.id===ticketId);
  if (!t) return null;
  const machine = (db.machines||[]).find(m=>m.id===parseInt(t.machineId));
  const assignedUser = (db.users||[]).find(u=>u.id===parseInt(t.assignedTo));

  const postComment = () => {
    if (!comment.trim()) return;
    const nc = {userId:user.id,userName:user.name,text:comment,date:now()};
    const tickets = (db.tickets||[]).map(tk=>tk.id===t.id
      ? {...tk,comments:[...(tk.comments||[]),nc],timeline:[...(tk.timeline||[]),{action:user.name+' commented',user:user.name,date:now()}]}
      : tk);
    let notifs = db.notifications||[];
    if (t.assignedTo && parseInt(t.assignedTo)!==user.id) {
      notifs = [...notifs,{id:nextId(notifs),userId:parseInt(t.assignedTo),
        title:'Comment on '+t.ticketNumber,body:user.name+': '+comment.slice(0,60),date:now(),read:false}];
    }
    onDbChange({...db,tickets,notifications:notifs},true);
    setComment('');
  };

  return h('div',{className:'modal-bg'},
    h('div',{className:'modal modal-lg'},
      h('div',{className:'modal-header'},
        h('div',{style:{display:'flex',alignItems:'center',gap:10}},
          h('h3',null,t.ticketNumber),
          h('span',{className:'badge '+sc(t.status)},t.status)
        ),
        h('div',{style:{display:'flex',gap:8}},
          h('button',{className:'btn btn-secondary btn-sm',onClick:()=>onEdit(t)},h(Icon,{name:'edit',size:13}),' Edit'),
          h('button',{className:'modal-close',onClick:onClose},'✕')
        )
      ),
      h('div',{style:{padding:'0 24px'}},
        h('div',{className:'tab-bar'},
          [['details','Details'],['comments','Comments ('+(t.comments||[]).length+')'],['timeline','Timeline']].map(([k,lbl])=>
            h('div',{key:k,className:'tab'+(tab===k?' active':''),onClick:()=>setTab(k)},lbl)
          )
        )
      ),
      h('div',{className:'modal-body'},
        tab==='details' && h('div',null,
          h('div',{className:'tdg'},
            ...[
              ['Contact Date',fmtDate(t.contactDate)],['Serial Number',h('strong',null,t.serialNumber)],
              ['Status',h('span',{className:'badge '+sc(t.status)},t.status)],['Ticket Type',t.ticketType||'—'],
              ['Reported By',t.reportedBy||'—'],['Assigned To',assignedUser?assignedUser.name:'—'],
              ['Model',machine?machine.model:'—'],['Biosans S/W',machine?machine.biosansVersion:'—'],
              ['Warranty',machine?h('span',{className:parseInt(machine.warrantyDays)>0?'wok':'wex'},parseInt(machine.warrantyDays)>0?(machine.warrantyDays+' days left'):'Expired'):'—'],
              ['Severity',t.severity||'—'],['Machine Status',t.machineStatus||'—'],['Resolution By',t.resolutionBy||'—'],
              ['Category',t.category||'—'],['Sub Category',t.subCategory||'—'],

          const row={};
          headers.forEach((h,idx)=>row[h]=vals[idx]||'');

          const role=validRoles.includes(row.role)?row.role:'Tech';
          const active=row.active!=='false';

            updated++;
          } else {
            if(!row.password){skipped++;continue;}
            current.push({...row,id:nextId(current),role,active,permissions:dp});
            added++;
          }

        onDbChange({...db,users:current},true);

        setTimeout(()=>setImportMsg(''),5000);
      }catch(err){setImportMsg('Error: '+err.message);}
    };
    reader.readAsText(file);
    e.target.value='';
  };
  return h('div',null,
    h('div',{className:'sh'},
      h('div',{className:'sh-title'},'Users & Permissions ('+users.length+')'),

    h('div',{className:'card'},

        h('thead',null,h('tr',null,h('th',null,'Name'),h('th',null,'Email'),h('th',null,'Role'),h('th',null,'Status'),h('th',null,'Permissions'),h('th',null,'Actions'))),

          h('td',null,u.email),
          h('td',null,h('span',{className:'badge '+rc(u.role)},u.role)),
          h('td',null,h('span',{className:'badge '+(u.active?'b-resolved':'b-pending')},u.active?'Active':'Inactive')),
          h('td',null,h('div',{style:{display:'flex',gap:3,flexWrap:'wrap'}},Object.entries(u.permissions||{}).filter(([,v])=>v).map(([k])=>h('span',{key:k,className:'badge b-open',style:{fontSize:10}},k)))),
          h('td',null,h('div',{className:'tbl-actions'},

            cu.role==='Admin'&&u.id!==cu.id&&h('button',{className:'btn btn-danger btn-xs',onClick:()=>del(u.id)},h(Icon,{name:'trash',size:12}))

      h('div',{className:'modal-header'},h('h3',null,editU?'Edit User':'Add User'),h('button',{className:'modal-close',onClick:()=>setShowForm(false)},'✕')),

  const sf=(k,v)=>setF(x=>({...x,[k]:v}));
  const toMs=d=>{try{return d?new Date(d).getTime():0;}catch{return 0;}};
  const fmtD=d=>{if(!d)return '--';try{return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch{return d;}};
  const listsDb=db.lists||{};
  const techUsers=users.filter(u=>u.role==='Tech'||u.role==='Admin');

  const ft=tickets.filter(t=>{
    if(f.df&&toMs(t.contactDate)<toMs(f.df))return false;
    if(f.dt&&toMs(t.contactDate)>toMs(f.dt))return false;
    if(f.tech&&t.assignedTo&&parseInt(t.assignedTo)!==parseInt(f.tech))return false;
    if(f.status&&t.status!==f.status)return false;
    if(f.type&&t.ticketType!==f.type)return false;
    return true;
  });

  const byKey=(arr,key)=>{const r={};arr.forEach(x=>{const k=x[key]||'Unknown';r[k]=(r[k]||0)+1;});return r;};
  const avgN=(arr,fn)=>{const v=arr.map(fn).filter(x=>x>0);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0;};

    if(!t.contactDate)return 0;
    const tl=t.timeline||[];
    const res=tl.find(e=>(e.action||'').toLowerCase().includes('resolved')||(e.action||'').toLowerCase().includes('closed'));
    if(!res)return 0;

      h('div',{className:'card'},
        h('div',{className:'card-header'},h('div',{className:'card-title'},'PM Due ('+pmDue.length+' machines)'),h('button',{className:'btn btn-secondary btn-xs',onClick:()=>csvDl(pmDue.map(m=>{const c=customers.find(x=>x.id===m.customerId);const pt=tickets.filter(t=>t.machineId===m.id&&(t.ticketType||'').includes('Preventive')).sort((a,b)=>toMs(b.contactDate)-toMs(a.contactDate));return{Serial:m.serialNumber,Model:m.model,Customer:c?c.name:'--',Location:m.location,LastPM:pt.length?pt[0].contactDate:'Never',Status:m.status};}), 'pm_due.csv')},'⬇ Export')),
        pmDue.length===0?h('div',{className:'es'},h('p',null,'All machines are up to date with PM.')):
        h('table',null,
          h('thead',null,h('tr',null,h('th',null,'Serial #'),h('th',null,'Model'),h('th',null,'Customer'),h('th',null,'Location'),h('th',null,'Last PM Visit'),h('th',null,'Machine Status'))),
          h('tbody',null,pmDue.map(m=>{

          }))

        h(SB,{label:'< 30 days',value:machines.filter(m=>{const w=parseInt(m.warrantyDays)||0;return w>0&&w<=30;}).length,icon:'⚠️',color:'#fee2e2',sub:'Critical'}),
        h(SB,{label:'31 - 90 days',value:machines.filter(m=>{const w=parseInt(m.warrantyDays)||0;return w>30&&w<=90;}).length,icon:'🟡',color:'#fef3c7',sub:'Warning'}),
        h(SB,{label:'> 90 days',value:machines.filter(m=>parseInt(m.warrantyDays)>90).length,icon:'✅',color:'#d1fae5',sub:'Healthy'})
      ),
      h('div',{className:'card'},
        h('div',{className:'card-header'},h('div',{className:'card-title'},'All Machines - Warranty Status'),h('button',{className:'btn btn-secondary btn-xs',onClick:()=>csvDl(machines.map(m=>{const c=customers.find(x=>x.id===m.customerId);const wd=parseInt(m.warrantyDays)||0;return{Serial:m.serialNumber,Model:m.model,Customer:c?c.name:'--',Location:m.location,DaysLeft:wd,Status:wd<=0?'Expired':wd<=30?'Critical':wd<=90?'Warning':'Active'};}), 'warranty.csv')},'⬇ Export')),
        h('table',null,
          h('thead',null,h('tr',null,h('th',null,'Serial #'),h('th',null,'Model'),h('th',null,'Customer'),h('th',null,'Location'),h('th',null,'Days Left'),h('th',null,'Status'))),
          h('tbody',null,[...machines].sort((a,b)=>(parseInt(a.warrantyDays)||0)-(parseInt(b.warrantyDays)||0)).map(m=>{
            const c=customers.find(x=>x.id===m.customerId);
            const wd=parseInt(m.warrantyDays)||0;
            const ws=wd<=0?'Expired':wd<=30?'Critical':wd<=90?'Warning':'Active';
            const wc=wd<=0?'b-pending':wd<=30?'b-crit':wd<=90?'b-noncrit':'b-resolved';
            return h('tr',{key:m.id},h('td',null,h('strong',null,m.serialNumber)),h('td',null,m.model),h('td',null,c?c.name:'--'),h('td',null,m.location||'--'),h('td',null,h('span',{style:{fontWeight:700,color:wd<=0?'var(--red)':wd<=30?'var(--red)':wd<=90?'var(--amber)':'var(--green)'}},wd>0?(wd+' days'):'EXPIRED')),h('td',null,h('span',{className:'badge '+wc},ws)));
          }))
        )
      )
    )
  );
}

// -- SETTINGS PAGE -------------------------------------------------------------
function SettingsPage({db, user, onDbChange}) {
  const [tab,setTab]=useState('lists');
  const [selKey,setSelKey]=useState(Object.keys(db.lists||{})[0]||'ticketTypes');
  const [nv,setNv]=useState('');
  const [pwForm,setPwForm]=useState({cur:'',nw:'',conf:''});
  const [pwMsg,setPwMsg]=useState('');
  const lists=db.lists||{};

  const addItem=()=>{
    if(!nv.trim())return;
    const updated={...db,lists:{...lists,[selKey]:[...(lists[selKey]||[]),nv.trim()]}};
    onDbChange(updated,true);setNv('');
  };
  const removeItem=idx=>{
    const updated={...db,lists:{...lists,[selKey]:(lists[selKey]||[]).filter((_,i)=>i!==idx)}};
    onDbChange(updated,true);
  };
  const changePw=()=>{
    const u=(db.users||[]).find(x=>x.id===user.id);
    if(u.password!==pwForm.cur){setPwMsg('error:Current password is incorrect');return;}
    if(pwForm.nw.length<8||!/[A-Z]/.test(pwForm.nw)||!/[0-9]/.test(pwForm.nw)||!/[^A-Za-z0-9]/.test(pwForm.nw)){setPwMsg('error:Password must be 8+ chars, 1 uppercase, 1 number, 1 symbol');return;}
    if(pwForm.nw!==pwForm.conf){setPwMsg('error:Passwords do not match');return;}
    onDbChange({...db,users:(db.users||[]).map(x=>x.id===user.id?{...x,password:pwForm.nw}:x)},true);
    setPwMsg('success:Password changed successfully!');
    setPwForm({cur:'',nw:'',conf:''});
  };

  return h('div',null,
    h('div',{className:'sh'},h('div',{className:'sh-title'},'Settings')),
    h('div',{className:'tab-bar'},
      [['lists','Manage Drop-Down Lists'],['password','Change Password'],['about','About']].map(([k,lbl])=>
        h('div',{key:k,className:'tab'+(tab===k?' active':''),onClick:()=>setTab(k)},lbl)
      )
    ),
    tab==='lists'&&h('div',{className:'card'},
      h('div',{className:'card-title',style:{marginBottom:14}},'Manage All Drop-Down Lists'),
      h('div',{style:{display:'flex',gap:10,marginBottom:14}},
        h('select',{value:selKey,onChange:e=>setSelKey(e.target.value),style:{minWidth:220,padding:'8px 10px',border:'1.5px solid var(--gray-border)',borderRadius:'var(--radius)',fontFamily:'var(--font)',fontSize:13}},
          Object.keys(lists).map(k=>h('option',{key:k,value:k},k.replace(/([A-Z])/g,' $1').trim()))
        )
      ),
      h('div',{style:{display:'flex',gap:8,marginBottom:12}},
        h('input',{type:'text',value:nv,onChange:e=>setNv(e.target.value),placeholder:'Add new item...',onKeyDown:e=>e.key==='Enter'&&addItem(),style:{flex:1,padding:'8px 10px',border:'1.5px solid var(--gray-border)',borderRadius:'var(--radius)',fontFamily:'var(--font)',fontSize:13}}),
        h('button',{className:'btn btn-primary',onClick:addItem},h(Icon,{name:'plus',size:14}),' Add')
      ),
      h('div',{style:{maxHeight:320,overflowY:'auto'}},
        (lists[selKey]||[]).map((item,idx)=>h('div',{key:idx,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',borderBottom:'1px solid #f0f4f8',background:idx%2===0?'#fafafa':'#fff'}},
          h('span',{style:{fontSize:13}},item),
          h('button',{className:'btn btn-danger btn-xs',onClick:()=>removeItem(idx)},h(Icon,{name:'trash',size:12}))
        ))
      )
    ),
    tab==='password'&&h('div',{className:'card',style:{maxWidth:420}},
      h('div',{className:'card-title',style:{marginBottom:16}},'Change Password'),
      pwMsg&&h('div',{className:'info-banner '+(pwMsg.startsWith('error:')?'info-red':'info-green')},pwMsg.split(':')[1]),
      h(FG,{label:'Current Password'},h('input',{type:'password',value:pwForm.cur,onChange:e=>setPwForm(f=>({...f,cur:e.target.value}))})),
      h(FG,{label:'New Password'},h('input',{type:'password',value:pwForm.nw,onChange:e=>setPwForm(f=>({...f,nw:e.target.value})),placeholder:'8+ chars, uppercase, number, symbol'})),
      h(FG,{label:'Confirm Password'},h('input',{type:'password',value:pwForm.conf,onChange:e=>setPwForm(f=>({...f,conf:e.target.value}))})),
      h('button',{className:'btn btn-primary',onClick:changePw},'Update Password')
    ),
    tab==='about'&&h('div',{className:'card',style:{textAlign:'center',padding:'32px'}},
      h(VitaLogo,{dark:true,width:160}),
      h('p',{style:{fontSize:14,color:'var(--gray)',marginTop:12}},'VITA Operations & Service Portal'),
      h('p',{style:{fontSize:12,color:'var(--gray2)',marginTop:6}},'Data stored on JSONBin cloud — syncs across all devices in real time'),
      h('p',{style:{fontSize:11,color:'var(--gray2)',marginTop:16}},'© 2024 VITA Detection. All rights reserved.')
    )
  );
}

// -- MAIN APP ------------------------------------------------------------------
function App() {
  const [loading, setLoading] = useState(true);
  const [loadMsg, setLoadMsg] = useState('Connecting to cloud...');
  const [db, setDb] = useState(null);
  const [syncStatus, setSyncStatus] = useState('ok'); // ok | syncing | error
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loginErr, setLoginErr] = useState('');
  const [showNotif, setShowNotif] = useState(false);
  const notifRef = useRef(null);
  const saveTimer = useRef(null);

  // Load data on mount -- JSONBin with localStorage fallback
  useEffect(() => {
    const load = async () => {
      try {
        setLoadMsg('Loading VITA Service Portal...');
        let data = await Api.read();
        if (!data || !data.users || data.users.length === 0) {
          setLoadMsg('First time setup...');
          data = JSON.parse(JSON.stringify(EMPTY_DB));
          await Api.write(data);
        }
        setDb(data);
        const sess = sessionStorage.getItem('vita_user');
        if (sess) { try { setUser(JSON.parse(sess)); } catch {} }
      } catch(e) {
        // Last resort -- start completely fresh
        const data = JSON.parse(JSON.stringify(EMPTY_DB));
        try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch {}
        setDb(data);
      }
      setLoading(false);
    };
    load();
  }, []);

  // Debounced save to JSONBin
  const saveToCloud = useCallback((newDb) => {
    setSyncStatus('syncing');
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await Api.write(newDb);
        setSyncStatus('ok');
      } catch(e) {
        setSyncStatus('error');
        setTimeout(() => setSyncStatus('ok'), 3000);
      }
    }, 800);
  }, []);

  const handleDbChange = useCallback((newDb, save=false) => {
    setDb(newDb);
    if (save) saveToCloud(newDb);
  }, [saveToCloud]);

  // Close notif panel on outside click
  useEffect(() => {
    const h = e => { if(notifRef.current && !notifRef.current.contains(e.target)) setShowNotif(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);

  // Loading screen
  if (loading || !db) return h('div',{className:'loading-screen'},
    h(VitaLogo,{dark:false,width:160}),
    h('div',{className:'spinner'}),
    h('div',{className:'loading-msg'},loadMsg)
  );

  // Login screen
  if (!user) {
    const doLogin = () => {
      const u = (db.users||[]).find(x=>x.email.trim().toLowerCase()===email.trim().toLowerCase() && x.password===password);
      if (!u) { setLoginErr('Invalid email or password'); return; }
      if (!u.active) { setLoginErr('Account inactive. Contact your administrator.'); return; }
      setUser(u);
      sessionStorage.setItem('vita_user', JSON.stringify(u));
      setLoginErr('');
    };
    return h('div',{className:'auth-wrap'},
      h('div',{className:'auth-card'},
        h('div',{className:'auth-logo'},
          h(VitaLogo,{dark:true,width:140}),
          h('p',null,'VITA — Operations & Service Portal')
        ),
        h('div',{className:'auth-title'},'Sign In'),
        h('div',{className:'auth-sub'},'Use your VITA email and password'),
        loginErr&&h('div',{className:'auth-err'},loginErr),
        h('input',{type:'email',placeholder:'Email address',value:email,className:'auth-input',onChange:e=>setEmail(e.target.value),onKeyDown:e=>e.key==='Enter'&&doLogin()}),
        h('input',{type:'password',placeholder:'Password',value:password,className:'auth-input',onChange:e=>setPassword(e.target.value),onKeyDown:e=>e.key==='Enter'&&doLogin()}),
        h('button',{className:'auth-btn',onClick:doLogin},'Sign In'),
        h('p',{style:{fontSize:11,color:'var(--gray2)',textAlign:'center',marginTop:16}},'Default admin: admin@vita.com / Admin@123')
      )
    );
  }

  const hasPerm = p => !p || user.role==='Admin' || (user.permissions&&user.permissions[p]);
  const logout = () => { setUser(null); sessionStorage.removeItem('vita_user'); };

  const unread = (db.notifications||[]).filter(n=>(!n.read)&&(n.userId===user.id||user.role==='Admin')).length;

  const NAV = [
    {id:'dashboard',label:'Dashboard',icon:'home',perm:null},
    {id:'tickets',label:'Tickets',icon:'ticket',perm:'tickets'},
    {id:'machines',label:'Machines',icon:'machine',perm:'machines'},
    {id:'customers',label:'Customers / CRM',icon:'crm',perm:'customers'},
    {id:'tools',label:'Tools',icon:'tool',perm:'tools'},
    {id:'reports',label:'Reports',icon:'report',perm:'reports'},
  ];
  const ADMIN_NAV = [
    {id:'users',label:'Users',icon:'users',perm:'users'},
    {id:'settings',label:'Settings',icon:'settings',perm:null},
  ];
  const PAGE_TITLES = {dashboard:'Dashboard',tickets:'Tickets',machines:'Machines / Scanners',customers:'Customers / CRM',tools:'Tools & Equipment',reports:'Reports',users:'Users & Permissions',settings:'Settings'};

  const syncLabel = syncStatus==='syncing'?'Syncing...':syncStatus==='error'?'Saved locally':'Synced ✓';

  return h('div',{className:'app'},
    // SIDEBAR
    h('div',{className:'sidebar'},
      h('div',{className:'sidebar-logo'},
        h(VitaLogo,{dark:false,width:120}),
        h('span',{className:'sidebar-logo-sub'},'Service Portal')
      ),
      h('div',{className:'nav-label'},'General'),
      NAV.filter(n=>hasPerm(n.perm)).map(n=>
        h('div',{key:n.id,className:'nav-item'+(page===n.id?' active':''),onClick:()=>setPage(n.id)},
          h(Icon,{name:n.icon,size:17}), n.label,
          n.id==='tickets'&&unread>0&&h('span',{className:'nav-badge'},unread)
        )
      ),
      (user.role==='Admin'||(db.users||[]).find(u=>u.id===user.id&&(u.permissions?.users)))&&h('div',{className:'nav-label'},'Admin'),
      ADMIN_NAV.filter(n=>hasPerm(n.perm)).map(n=>
        h('div',{key:n.id,className:'nav-item'+(page===n.id?' active':''),onClick:()=>setPage(n.id)},
          h(Icon,{name:n.icon,size:17}), n.label
        )
      ),
      h('div',{className:'sidebar-footer'},
        h('div',{className:'user-pill',onClick:logout},
          h('div',{className:'avatar',style:{width:30,height:30,fontSize:11}},initials(user.name)),
          h('div',{style:{flex:1,overflow:'hidden'}},
            h('div',{style:{fontSize:12,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},user.name),
            h('div',{style:{fontSize:10,opacity:.6}},user.role+' - Sign out')
          ),
          h(Icon,{name:'logout',size:13,style:{opacity:.5}})
        )
      )
    ),
    // MAIN
    h('div',{className:'main'},
      h('div',{className:'topbar'},
        h('div',{className:'topbar-title'},PAGE_TITLES[page]||''),
        h('div',{className:'topbar-right'},
          h('div',{className:'sync-indicator'},
            h('div',{className:'sync-dot'+( syncStatus==='syncing'?' syncing':syncStatus==='error'?' error':'')}),
            syncLabel
          ),
          h('div',{style:{position:'relative'},ref:notifRef},
            h('button',{className:'notif-btn',onClick:()=>setShowNotif(v=>!v)},
              h(Icon,{name:'bell',size:17}),
              unread>0&&h('div',{className:'notif-dot'})
            ),
            showNotif&&h(NotifPanel,{db,userId:user.id,onClose:()=>setShowNotif(false),onDbChange:handleDbChange})
          ),
          h('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'5px 12px',background:'var(--gray-light)',borderRadius:'var(--radius)',border:'1px solid var(--gray-border)'}},
            h('div',{className:'avatar',style:{width:26,height:26,fontSize:11,background:'var(--navy)'}},initials(user.name)),
            h('span',{style:{fontSize:13,fontWeight:500}},user.name),
            h('span',{className:'badge '+rc(user.role)},user.role)
          )
        )
      ),
      h('div',{className:'content'},
        page==='dashboard' && h(Dashboard,{db,user}),
        page==='tickets' && hasPerm('tickets') && h(TicketsPage,{db,user,onDbChange:handleDbChange}),
        page==='machines' && hasPerm('machines') && h(MachinesPage,{db,user,onDbChange:handleDbChange}),
        page==='customers' && hasPerm('customers') && h(CustomersPage,{db,user,onDbChange:handleDbChange}),
        page==='tools' && hasPerm('tools') && h(ToolsPage,{db,user,onDbChange:handleDbChange}),
        page==='reports' && hasPerm('reports') && h(ReportsPage,{db}),
        page==='users' && hasPerm('users') && h(UsersPage,{db,user,onDbChange:handleDbChange}),
        page==='settings' && h(SettingsPage,{db,user,onDbChange:handleDbChange}),
        !hasPerm(NAV.find(n=>n.id===page)?.perm) && page!=='dashboard' && page!=='settings' && page!=='users' &&
          h('div',{className:'card',style:{textAlign:'center',padding:48}},
            h('div',{style:{fontSize:40,marginBottom:12}},'🔒'),
            h('h3',{style:{color:'var(--navy)',marginBottom:8}},'Access Restricted'),
            h('p',{style:{color:'var(--gray)',fontSize:14}},'You do not have permission to access this page.')
          )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
</script>
